<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPulse - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">📈 MarketPulse</h1>
            <p class="text-white/80">Join the smart way to track markets</p>
        </div>

        <div class="bg-white/90 rounded-2xl p-6 shadow-xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Account</h2>
            
            <div id="signupError" class="hidden mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm"></div>
            
            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="signupEmail" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" id="signupPassword" required minlength="6"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                    <p class="text-xs text-gray-500 mt-1">Must be at least 6 characters</p>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" required minlength="6"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                </div>
                
                <button type="submit" 
                        class="btn-primary w-full text-white py-3 rounded-xl font-semibold">
                    Create Account →
                </button>
            </form>
            
            <p class="mt-6 text-center text-gray-600">
                Already have an account? 
                <a href="/login" class="text-purple-600 hover:text-purple-800 font-semibold">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                document.getElementById('signupError').textContent = 'Passwords do not match';
                document.getElementById('signupError').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('authToken', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    const error = await res.json();
                    document.getElementById('signupError').textContent = error.detail;
                    document.getElementById('signupError').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('signupError').textContent = 'Network error. Please try again.';
                document.getElementById('signupError').classList.remove('hidden');
            }
        });

        if (localStorage.getItem('authToken')) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
